<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bigshoot full-page capture fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        color: white;
        font-family: Rockwell, Georgia, serif;
      }
      .band {
        display: grid;
        height: 360px;
        place-items: center;
        font-size: 48px;
        font-weight: 900;
      }
      .band-1 { background: #153e5c; }
      .stage {
        display: grid;
        min-height: 840px;
        place-items: center;
        color: #102a30;
        background: #f4c95d;
      }
      .stage h1 {
        max-width: 720px;
        margin: 0;
        font-size: 64px;
        line-height: .95;
        text-align: center;
      }
      .band-2 { background: #e86a33; }
      .band-3 { background: #2b8a6e; }
      .band-4 { background: #c13f5b; }
      footer { height: 80px; background: #102a30; }
    </style>
  </head>
  <body>
    <section class="band band-1">PAGE 1</section>
    <main class="stage">
      <h1 id="page-marker">One shortcut.<br>The whole page.</h1>
    </main>
    <section class="band band-2">PAGE 2</section>
    <section class="band band-3">PAGE 3</section>
    <section class="band band-4">PAGE 4</section>
    <footer></footer>
  </body>
</html>
