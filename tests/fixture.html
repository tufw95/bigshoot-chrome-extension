<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bigshoot deterministic capture fixture</title>
    <style>
      :root {
        color: #102a30;
        background: #edf4f2;
        font-family: Avenir, "Trebuchet MS", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }

      .page-band {
        display: grid;
        height: 360px;
        place-items: center;
        color: white;
        font: 800 44px/1 Rockwell, Georgia, serif;
        letter-spacing: -.03em;
      }

      .page-band-1 { background: #153e5c; }
      .page-band-2 { background: #e86a33; }
      .page-band-3 { background: #2b8a6e; }
      .page-band-4 { background: #c13f5b; }

      .fixture-stage {
        position: relative;
        min-height: 840px;
        padding: 64px;
        background: #f4c95d;
      }

      .fixture-heading {
        max-width: 720px;
        margin: 0 0 36px;
        font: 800 54px/.98 Rockwell, Georgia, serif;
        letter-spacing: -.04em;
      }

      .static-element {
        width: 420px;
        height: 240px;
        border: 12px solid #14213d;
        background: linear-gradient(
          to bottom,
          #ea3546 0 25%,
          #3bceac 25% 50%,
          #ffbe0b 50% 75%,
          #5f4bb6 75% 100%
        );
      }

      .static-element::after {
        content: "STATIC";
        display: grid;
        height: 100%;
        place-items: center;
        color: #14213d;
        font: 900 32px/1 Rockwell, Georgia, serif;
      }

      .self-scroll {
        position: absolute;
        top: 64px;
        right: 64px;
        width: 360px;
        height: 360px;
        overflow-y: scroll;
        overscroll-behavior: contain;
        border: 10px solid #102a30;
        background: white;
        scrollbar-width: none;
      }

      .self-scroll::-webkit-scrollbar,
      .drawer-body::-webkit-scrollbar {
        display: none;
      }

      .scroll-band {
        display: grid;
        height: 180px;
        place-items: center;
        color: white;
        font: 900 46px/1 Rockwell, Georgia, serif;
      }

      .scroll-band-1 { background: #d7263d; }
      .scroll-band-2 { background: #1b998b; }
      .scroll-band-3 { background: #ff9f1c; }
      .scroll-band-4 { background: #5c4d7d; }
      .scroll-band-5 { background: #2d6cdf; }

      .sticky-scroll-label {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        height: 40px;
        place-items: center;
        color: white;
        background: #102a30;
        font: 800 13px/1 Avenir, "Trebuchet MS", sans-serif;
        letter-spacing: .08em;
      }

      .open-drawer {
        margin-top: 40px;
        padding: 13px 20px;
        color: white;
        background: #102a30;
        border: 0;
        border-radius: 8px;
        font: 800 16px/1 Avenir, "Trebuchet MS", sans-serif;
        cursor: pointer;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(7, 18, 23, .48);
      }

      .drawer-backdrop[hidden],
      .test-drawer[hidden] {
        display: none;
      }

      .test-drawer {
        position: fixed;
        z-index: 21;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        width: 520px;
        flex-direction: column;
        background: white;
        box-shadow: -24px 0 70px rgba(7, 18, 23, .32);
      }

      .test-drawer[data-layout="split"] {
        display: grid;
        grid-template-columns: 120px 1fr;
        grid-template-rows: 120px minmax(0, 1fr);
      }

      .test-drawer[data-layout="split"] .drawer-header {
        grid-column: 1 / -1;
      }

      .drawer-static-rail {
        display: none;
        grid-row: 2;
        place-items: center;
        color: white;
        background: #023047;
        font: 900 17px/1 Rockwell, Georgia, serif;
        writing-mode: vertical-rl;
      }

      .test-drawer[data-layout="split"] .drawer-static-rail {
        display: grid;
      }

      .drawer-header {
        display: grid;
        flex: 0 0 120px;
        place-items: center;
        color: white;
        background: #102a30;
        border-bottom: 8px solid #7ae7c7;
        font: 900 27px/1 Rockwell, Georgia, serif;
      }

      .drawer-body {
        min-height: 0;
        flex: 1 1 auto;
        overflow-y: scroll;
        overscroll-behavior: contain;
        background: white;
        scrollbar-width: none;
      }

      .drawer-fixed-control {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 30;
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        color: white;
        background: #00b4d8;
        border-radius: 50%;
        font: 900 12px/1 Avenir, "Trebuchet MS", sans-serif;
      }

      .drawer-band {
        display: grid;
        height: 240px;
        place-items: center;
        color: white;
        font: 900 42px/1 Rockwell, Georgia, serif;
      }

      .drawer-band-1 { background: #ef476f; }
      .drawer-band-2 { background: #118ab2; }
      .drawer-band-3 { background: #f78c6b; }
      .drawer-band-4 { background: #6a4c93; }

      .document-end {
        height: 80px;
        background: #102a30;
      }
    </style>
  </head>
  <body>
    <section class="page-band page-band-1" data-page-band="1">PAGE 1</section>
    <main class="fixture-stage">
      <h1 class="fixture-heading">Deterministic screenshot geometry</h1>
      <section class="static-element" data-capture="static" aria-label="Static capture target"></section>
      <aside class="self-scroll" id="self-scroll" data-capture="self-scroll" aria-label="Scrollable capture target">
        <div class="sticky-scroll-label">STICKY LABEL</div>
        <div class="scroll-band scroll-band-1" data-scroll-band="1">SCROLL 1</div>
        <div class="scroll-band scroll-band-2" data-scroll-band="2">SCROLL 2</div>
        <div class="scroll-band scroll-band-3" data-scroll-band="3">SCROLL 3</div>
        <div class="scroll-band scroll-band-4" data-scroll-band="4">SCROLL 4</div>
        <div class="scroll-band scroll-band-5" data-scroll-band="5">SCROLL 5</div>
      </aside>
      <button class="open-drawer" type="button">Open deterministic drawer</button>
    </main>
    <section class="page-band page-band-2" data-page-band="2">PAGE 2</section>
    <section class="page-band page-band-3" data-page-band="3">PAGE 3</section>
    <section class="page-band page-band-4" data-page-band="4">PAGE 4</section>
    <footer class="document-end"></footer>

    <div class="drawer-backdrop" hidden></div>
    <section class="test-drawer" role="dialog" aria-modal="true" aria-label="Scrollable drawer capture target" hidden>
      <header class="drawer-header">DRAWER HEADER</header>
      <aside class="drawer-static-rail">STATIC RAIL</aside>
      <div class="drawer-body" id="drawer-body">
        <div class="drawer-band drawer-band-1" data-drawer-band="1">DRAWER 1</div>
        <div class="drawer-band drawer-band-2" data-drawer-band="2">DRAWER 2</div>
        <div class="drawer-band drawer-band-3" data-drawer-band="3">DRAWER 3</div>
        <div class="drawer-band drawer-band-4" data-drawer-band="4">DRAWER 4</div>
        <div class="drawer-fixed-control">FIXED</div>
      </div>
    </section>

    <script>
      const openDrawer = document.querySelector(".open-drawer");
      const drawer = document.querySelector(".test-drawer");
      const backdrop = document.querySelector(".drawer-backdrop");

      openDrawer.addEventListener("click", () => {
        drawer.hidden = false;
        backdrop.hidden = false;
        drawer.classList.add("drawer-on");
      });
    </script>
  </body>
</html>
